<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:grid;place-items:center}
video{display:block;width:min(100vw,177.77777778vh);height:auto;aspect-ratio:16/9;object-fit:contain;background:transparent}
</style>
<video autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback src="media/sleigh.ebea86de454537f4.mp4"></video>
<script>
const video=document.querySelector('video');
video.muted=true;
const play=()=>video.play().catch(()=>{});
play();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)play()});
window.addEventListener('pageshow',play);
document.addEventListener('pointerdown',play,{once:true});
</script>
</html>
